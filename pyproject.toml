[project]
name = "stream-canary"
version = "0.1.0"
description = "Safe-rollout orchestrator for Kafka stream processors: mirror a prod partition into an isolated canary, verify output conditions, then promote or roll back"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "testcontainers[kafka]>=4.7",
]

[project.scripts]
stream-canary = "stream_canary.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stream_canary"]

[tool.pytest.ini_options]
timeout = 300
