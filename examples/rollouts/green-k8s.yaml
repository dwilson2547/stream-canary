# Green path on the home k8s cluster: canary v2.0.1 as an ephemeral Deployment
# in the stream-canary namespace; prod is the upper-prod Deployment. Promote
# is `kubectl set image` once verify + gates pass.
name: upper-v2-green-k8s
broker: kafka
prod:
  bootstrap: 192.168.0.35:31992
  input_topic: orders.raw
  output_topic: orders.enriched
  partition: 0
canary:
  bootstrap: 192.168.0.35:31992
  input_topic: canary.orders.raw
  output_topic: canary.orders.enriched
deploy:
  runtime: k8s
  k8s:
    namespace: stream-canary
    name: canary-upper
    image: dwilson2547/stream-canary-processor:2.0.1
  env:
    BOOTSTRAP: 192.168.0.35:31992
    INPUT_TOPIC: canary.orders.raw
    OUTPUT_TOPIC: canary.orders.enriched
    GROUP: canary-upper
    PROCESSOR_VERSION: "2.0.1"
  consumer_group: canary-upper
  readiness_timeout_s: 120
mirror:
  mode: replay
  sample_size: 200
verify:
  - type: schema
    fields:
      order_id: str
      total_cents: int
      status: str
      version: str
  - type: equivalence
    join_key: order_id
    ignore_fields: [processed_at_ms]
    allow_diff:
      version: "2.0.1"
  - type: lag
    group: canary-upper
    topic: canary.orders.raw
    max_lag: 10
gates:
  - type: exec
    command: "true"
on_success: promote
promote_command: kubectl set image deployment/upper-prod service=dwilson2547/stream-canary-processor:2.0.1 -n stream-canary
